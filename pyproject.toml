[project]
name = "lambat"
version = "0.1.0"
description = "Post-flood leptospirosis exposure, access and dose-point siting for a city health office"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "osmnx>=1.9",
    "networkx>=3.2",
    "pulp>=2.8,<3",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
cv = [
    "torch>=2.2",
    "segmentation-models-pytorch>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyterlab>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lambat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
