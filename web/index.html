<style>
/* boot loader: painted before any stylesheet, font or script arrives; app.js fades it out after the first page draws */
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:18px;background:#EEEEEE;color:#4A5168;font:500 14px/1.2 system-ui,sans-serif;transition:opacity .35s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot svg{width:64px;height:57px;animation:boot-breathe 1.6s ease-in-out infinite}
#boot .boot-bar{position:relative;width:160px;height:4px;border-radius:2px;background:#D3D6DE;overflow:hidden}
#boot .boot-bar i{position:absolute;top:0;left:0;height:100%;width:40%;border-radius:2px;background:#0038BD;animation:boot-slide 1.1s cubic-bezier(.4,0,.2,1) infinite}
@keyframes boot-breathe{50%{transform:scale(.94);opacity:.8}}
@keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#boot svg,#boot .boot-bar i{animation:none}#boot .boot-bar i{width:100%}}
</style>
